<!DOCTYPE html>
<html>
<head>
  <title>Just One</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="titleScreen">
    <h1>Just One...</h1>

    <!-- Portrait -->
    <div style="text-align: center;">
      <img src="images/one.jpg" alt="The One" style="max-width: 300px; border-radius: 10px; box-shadow: 0 0 20px #444;">
    </div>
    
    <p class="tagline">
      The ultimate choice is yours.
    </p>
  
    <button onclick="startGame()">Start Game</button>
  </div>

  <!-- GAME SCREEN WRAPPER -->
  <div id="gameScreen">
    
    <img scr="" id="sceneImage" alt="Scene"></div>
    
    <div id="story"></div>
  
    <div id="choices"></div>
  
    <div id="npcDialogue"></div>
    
    <h2>Inventory</h2>
    
    <ul id="inventory"></ul>

  </div>

  <audio id="menuMusic" loop>
  <source src="audio/menu.mp3" type="audio/mp3">
  </audio>

  

  <script src="game.js"></script>

</body>
</html>
